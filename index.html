<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymTrack">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>GymTrack · V16.1 Flexible</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header class="topbar">
  <div>
    <div class="brand">GymTrack</div>
    <div class="sub" id="headerSub">Tu entrenamiento, organizado.</div>
  </div>
  <button class="iconbtn" id="settingsBtn" aria-label="Ajustes">⚙️</button>
</header>

<main id="main"></main>

<nav class="nav">
  <button data-tab="home" class="navbtn active"><span>⌂</span><small>Inicio</small></button>
  <button data-tab="plan" class="navbtn"><span>▦</span><small>Plan</small></button>
  <button data-tab="train" class="navbtn"><span>🏋️</span><small>Entrenar</small></button>
  <button data-tab="progress" class="navbtn"><span>◔</span><small>Progreso</small></button>
  <button data-tab="more" class="navbtn"><span>•••</span><small>Más</small></button>
</nav>
</div>

<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
